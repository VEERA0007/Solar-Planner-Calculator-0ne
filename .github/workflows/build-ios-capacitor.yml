name: Build iOS Capacitor Project

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional live backend URL for real-time mobile API sync'
        required: false
        default: ''

jobs:
  ios-capacitor-sync:
    name: Sync iOS Xcode Project (Capacitor 8)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build web bundle
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.VITE_API_BASE_URL || '' }}
        run: |
          npm install
          npm run build

      - name: Generate & sync Capacitor iOS project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarPlannerCalculator-ios-project
          path: ios/
          retention-days: 30
          
